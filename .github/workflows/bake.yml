
name: Huawei E5785 Firmware Baker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Check firmware inputs
        run: |
          test -f baker.py
          test -f cpio.py
          test -f APP.E5785.orig.bin
          test -f System.E5785.orig.bin
          test -d app
          test -d system

      - name: Bake firmware
        run: python3 baker.py

      - name: Verify output files
        run: |
          test -s APP.E5785.bin
          test -s System.E5785.bin

      - name: Upload baked firmware
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-E5785-Baked-Firmware
          path: |
            APP.E5785.bin
            System.E5785.bin
          if-no-files-found: error
          retention-days: 7
