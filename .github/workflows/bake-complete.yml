name: Bake Complete E5785 Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout firmware baking repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ qtbase5-dev qt5-qmake zlib1g-dev pkg-config

      - name: Download original firmware release
        run: |
          curl -fL --retry 3 \
            'https://github.com/saqie1393/Huawei_E5785_fw_bake/releases/download/1.0.0/E5785_Update_21.191.63.01.375.bin' \
            -o E5785_original.bin
          test -s E5785_original.bin

      - name: Bake APP and System partitions
        run: |
          test -f baker.py
          python3 baker.py
          test -s APP.E5785.bin
          test -s System.E5785.bin

      - name: Build qhuaweiflash partition writer
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/forth32/qhuaweiflash.git qhuaweiflash
          cp tools/bake_firmware.cpp qhuaweiflash/bake_firmware.cpp
          cd qhuaweiflash

          # sanity: file must be complete (ends with '}')
          tail -n 1 bake_firmware.cpp | grep -q '}' || {
            echo "bake_firmware.cpp appears truncated"; exit 1; }

          # Ensure QComboBox header is present
          if ! grep -q 'QtWidgets/QComboBox' bake_firmware.cpp; then
            sed -i '1a #include <QtWidgets/QComboBox>' bake_firmware.cpp
          fi

          echo "=== Qt configuration ==="
          pkg-config --cflags Qt5Widgets
          pkg-config --libs Qt5Widgets

          # Compile PIC (required by Qt). Do NOT pass -fno-PIE here.
          g++ -std=c++11 -fPIC -O2 \
            $(pkg-config --cflags Qt5Widgets) -I. \
            -c bake_firmware.cpp ptable.cpp sio.cpp

          # Link. -no-pie gives a classic non-PIE executable.
          g++ -no-pie *.o -o bake_firmware \
            $(pkg-config --libs Qt5Widgets) -lz

          file bake_firmware
          test -x bake_firmware

      - name: Replace System and APP and write full firmware
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./qhuaweiflash/bake_firmware \
            E5785_original.bin System.E5785.bin APP.E5785.bin \
            E5785_modified_TEST_ONLY.bin
          test -s E5785_modified_TEST_ONLY.bin
          sha256sum E5785_original.bin APP.E5785.bin System.E5785.bin E5785_modified_TEST_ONLY.bin
          stat -c '%n %s bytes' E5785_original.bin APP.E5785.bin System.E5785.bin E5785_modified_TEST_ONLY.bin

      - name: Upload firmware test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E5785-Firmware-TEST-ONLY
          if-no-files-found: error
          path: |
            E5785_modified_TEST_ONLY.bin
            E5785_original.bin
            APP.E5785.bin
            System.E5785.bin
